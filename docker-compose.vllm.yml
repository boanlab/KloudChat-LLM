# Everything a GPU node serves, started per node. External OpenAI-compatible
# backends from LiteLLM's side (VLLM_*_URL in .env), placed and started by the
# scheduler over SSH.
#
#   vllm-qwen122b   top chat — Qwen3.5-122B-A10B (vision, 128K ctx here, 78 GiB)
#   vllm-qwen35b    unified chat and floor — Qwen3.6-35B-A3B (vision, 262K ctx)
#   vllm-glmflash   cheap-decode floor — GLM-4.7-Flash 31.2B-A3B
#   vllm-gemma26b   second family — Gemma-4-26B-A4B (vision, tool calling)
#   vllm-coder30b   coding — Qwen3-Coder-30B-A3B (FP8, 48 KiB/token KV)
#   vllm-codernext  coding — Qwen3-Coder-Next-80B (FP8, hybrid attention)
#   vllm-qwen27b    the one dense model — Qwen3.6-27B
#   vllm-bgem3      retrieval embeddings — BAAI/bge-m3, pooling runner (~2 GiB)
#   vllm-rerank     retrieval reranking — BAAI/bge-reranker-v2-m3 (~2.2 GiB)
#   whisper         transcription — resident on the node rather than placed.
#                   amd64 only: arm64 nodes skip it and delegate STT to OpenRouter
#
# Two chat models on one node is ~41 GiB of weights, so PRO5000 (48G) or larger.
# NVFP4 weights need an FP4-capable card. The image defaults to arm64; amd64
# nodes set VLLM_IMAGE.
#
# VLLM_<MODEL>_DEVICES: cards a container may use, written by the scheduler on
# multi-card nodes so two models take two cards — gpu-memory-utilization is a
# fraction of a device, not of the node. It is passed as NVIDIA_VISIBLE_DEVICES,
# never CUDA_VISIBLE_DEVICES: the runtime variable has a safe "all", the CUDA one
# has no such value and fails engine init on GB10.
name: kloudchat-vllm

services:
  vllm-qwen35b:
    container_name: vllm-qwen35b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    # Every vLLM service shares one image, so the build stanza lives here only.
    # BASE_IMAGE is the upstream image; VLLM_IMAGE is what this repo builds on top
    # of it. install-vllm.sh normally does this build and records both in .env.
    build:
      context: ./services/vllm
      args:
        BASE_IMAGE: ${VLLM_BASE_IMAGE:-vllm/vllm-openai:nightly-aarch64}
    restart: unless-stopped
    ipc: host
    # List form: a YAML flow scalar would eat the quotes in the JSON arguments
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3.6-35b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_QWEN35B_MAX_LEN:-262144}"
      - --gpu-memory-utilization
      - "${VLLM_QWEN35B_GPU_UTIL:-0.55}"
      - --kv-cache-dtype
      - fp8
      # Reserves the multimodal vision mm-budget, which needs batched-tokens >= 16384
      - --max-num-batched-tokens
      - "${VLLM_QWEN35B_MAX_BATCHED_TOKENS:-16384}"
      # qwen3_xml matches the tool-call format of the Qwen3.6 chat template
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      # Splits <think>...</think> out into reasoning_content
      - --reasoning-parser
      - qwen3
      # Thinking off by default — latency and tokens in ordinary chat.
      # Enabled per request through chat_template_kwargs.
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      # Per-sequence conv-state cache limits CUDA-graph capture. Unset, cudagraph
      # profiling OOMs.
      - --max-num-seqs
      - "${VLLM_QWEN35B_MAX_NUM_SEQS:-128}"
      - --tensor-parallel-size
      - "${VLLM_QWEN35B_TP:-1}"
      - --trust-remote-code
      # No --enforce-eager: CUDA graphs off costs 4x decode throughput
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_QWEN35B_DIR:-qwen3.6-35b-nvfp4}:/model:ro
    ports:
      - "8001:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_QWEN35B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Weight load, torch.compile and KV profiling on first start
      start_period: 600s

  # Top chat model. Same family and parsers as vllm-qwen35b; 78 GiB of weights
  # leaves ~22 GiB of KV, so the context is pinned at 128K, not the native 262K.
  vllm-qwen122b:
    container_name: vllm-qwen122b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3.5-122b-a10b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_QWEN122B_MAX_LEN:-131072}"
      - --gpu-memory-utilization
      - "${VLLM_QWEN122B_GPU_UTIL:-0.85}"
      - --kv-cache-dtype
      - fp8
      - --max-num-batched-tokens
      - "${VLLM_QWEN122B_MAX_BATCHED_TOKENS:-16384}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      # Linear-attention conv state is 21.4 MiB per sequence — 2.7 GiB at 128,
      # out of a ~22 GiB pool. Kept low; more is queue depth the card cannot serve.
      - --max-num-seqs
      - "${VLLM_QWEN122B_MAX_NUM_SEQS:-32}"
      # Cards to shard across, written by the scheduler. 1 is a single card;
      # a 96 GiB card needs 2, which the 78 GiB of weights do not fit whole.
      - --tensor-parallel-size
      - "${VLLM_QWEN122B_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_QWEN122B_DIR:-qwen3.5-122b-a10b}:/model:ro
    ports:
      - "8004:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_QWEN122B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # 78 GiB of weights to read off disk before torch.compile even starts.
      start_period: 1200s

  # Title generation, memory extraction, query rewriting, default chat. 3B active
  # parameters, so this call volume does not tie up the larger model.
  vllm-glmflash:
    container_name: vllm-glmflash
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/glm-4.7-flash
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_GLMFLASH_MAX_LEN:-131072}"
      - --gpu-memory-utilization
      - "${VLLM_GLMFLASH_GPU_UTIL:-0.65}"
      - --kv-cache-dtype
      - fp8
      - --max-num-batched-tokens
      - "${VLLM_GLMFLASH_MAX_BATCHED_TOKENS:-16384}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm45
      # Without it, chain-of-thought leaks into content. glm47 is the registered
      # name for the GLM-4.7 family.
      - --reasoning-parser
      - glm47
      # Thinking off by default: with a small max_tokens it spends the budget on
      # reasoning and returns empty content
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --tensor-parallel-size
      - "${VLLM_GLMFLASH_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_GLMFLASH_DIR:-glm-4.7-flash}:/model:ro
    ports:
      - "8002:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_GLMFLASH_DEVICES:-all}
      # MLA backend is a per-card choice — TRITON_MLA exceeds GB10's shared
      # memory limit and fails engine init. install-vllm.sh writes the card's
      # value (lib.sh::mla_attention_backend); empty lets vLLM choose.
      VLLM_ATTENTION_BACKEND: ${VLLM_GLMFLASH_ATTN_BACKEND-FLASHINFER_MLA}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # A second family. Gemma 4's <|tool> form needs the `gemma4` parser; without
  # it the model falls back to ReAct text and no client can execute anything.
  # Five layers in six are sliding-window (1024), so 256K is cheap in KV.
  vllm-gemma26b:
    container_name: vllm-gemma26b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/gemma-4-26b-a4b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_GEMMA26B_MAX_LEN:-262144}"
      - --gpu-memory-utilization
      - "${VLLM_GEMMA26B_GPU_UTIL:-0.45}"
      - --kv-cache-dtype
      - fp8
      # Vision model, so the mm-budget floor applies here too
      - --max-num-batched-tokens
      - "${VLLM_GEMMA26B_MAX_BATCHED_TOKENS:-16384}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --tensor-parallel-size
      - "${VLLM_GEMMA26B_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_GEMMA26B_DIR:-gemma-4-26b}:/model:ro
    ports:
      - "8005:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_GEMMA26B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # Coding. Qwen3-Coder's XML tool dialect needs `qwen3_coder`; `qwen3_xml` is a
  # different format and silently yields no tool calls. No thinking mode, so no
  # reasoning parser.
  vllm-coder30b:
    container_name: vllm-coder30b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3-coder-30b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_CODER30B_MAX_LEN:-131072}"
      - --gpu-memory-utilization
      - "${VLLM_CODER30B_GPU_UTIL:-0.60}"
      - --kv-cache-dtype
      - fp8
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --tensor-parallel-size
      - "${VLLM_CODER30B_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_CODER30B_DIR:-qwen3-coder-30b}:/model:ro
    ports:
      - "8006:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_CODER30B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # Coding, the larger of the two. Same `qwen3_coder` dialect as the 30B; KV on
  # 12 of 48 layers, the rest linear, which is what makes the native 262K fit.
  vllm-codernext:
    container_name: vllm-codernext
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3-coder-next
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_CODERNEXT_MAX_LEN:-262144}"
      # 75 GiB of weights on a 121.6 GiB card; the rest is KV at 12 KiB/token.
      - --gpu-memory-utilization
      - "${VLLM_CODERNEXT_GPU_UTIL:-0.85}"
      - --kv-cache-dtype
      - fp8
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --tensor-parallel-size
      - "${VLLM_CODERNEXT_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_CODERNEXT_DIR:-qwen3-coder-next}:/model:ro
    ports:
      - "8008:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      # DeepGEMM rejects this checkpoint's FP8 128x128 scale-factor layout on
      # GB10, at engine init. Set to 1 where the kernel takes it.
      VLLM_USE_DEEP_GEMM: ${VLLM_CODERNEXT_DEEP_GEMM:-0}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_CODERNEXT_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # The one dense model. Same family plumbing as vllm-qwen35b; every parameter
  # active, which costs decode rather than memory.
  vllm-qwen27b:
    container_name: vllm-qwen27b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3.6-27b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_QWEN27B_MAX_LEN:-131072}"
      - --gpu-memory-utilization
      - "${VLLM_QWEN27B_GPU_UTIL:-0.45}"
      - --kv-cache-dtype
      - fp8
      - --max-num-batched-tokens
      - "${VLLM_QWEN27B_MAX_BATCHED_TOKENS:-16384}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --tensor-parallel-size
      - "${VLLM_QWEN27B_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_QWEN27B_DIR:-qwen3.6-27b}:/model:ro
    ports:
      - "8007:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_QWEN27B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # Retrieval reranking. Pooling runner scoring (query, passage) pairs. Exposed
  # at /v1/rerank. ~2.2 GiB, so it shares a card.
  vllm-rerank:
    container_name: vllm-rerank
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/bge-reranker-v2-m3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --runner
      - pooling
      # Query and passage share the window; 8194 is what the checkpoint declares.
      - --max-model-len
      - "${VLLM_RERANK_MAX_LEN:-8192}"
      - --gpu-memory-utilization
      - "${VLLM_RERANK_GPU_UTIL:-0.06}"
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_RERANK_DIR:-bge-reranker-v2-m3}:/model:ro
    ports:
      - "8009:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_RERANK_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Retrieval embeddings. A pooling runner: no tool parser, no reasoning parser,
  # no chat-template kwargs, no KV cache. ~2 GiB, so it shares a card.
  vllm-bgem3:
    container_name: vllm-bgem3
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/bge-m3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Pooling, not generation: makes /v1/embeddings answer.
      - --runner
      - pooling
      # bge-m3 declares 8194 positions; well past any chunk the indexer sends.
      - --max-model-len
      - "${VLLM_BGEM3_MAX_LEN:-8192}"
      # Overwritten by the scheduler per placement; a floor for standalone runs.
      - --gpu-memory-utilization
      - "${VLLM_BGEM3_GPU_UTIL:-0.08}"
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_BGEM3_DIR:-bge-m3}:/model:ro
    ports:
      - "8003:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_BGEM3_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # No torch.compile or KV profiling to wait through.
      start_period: 120s

  # Transcription backend, resident on the vLLM card, called by whisper-shim
  # through WHISPER_URLS. amd64 only — aarch64 ctranslate2 wheels are CPU-only,
  # and an empty WHISPER_URLS routes STT to OpenRouter.
  whisper:
    container_name: whisper
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-whisper:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/whisper
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-9000}:9000"
    environment:
      # HF token for the lazy-load download — rate limits
      HF_TOKEN: ${HF_TOKEN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
    volumes:
      # Weight cache (HF_HOME) — downloaded once
      - ${WHISPER_DATA_ROOT:-/var/lib/whisper}:/var/lib/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
