# GPU-node services. Started per node by the scheduler over SSH; LiteLLM reaches
# them through VLLM_*_URL in the orchestrator's .env.
#
#   vllm-qwen35b    default chat — Qwen3.6-35B-A3B (vision, 262K)
#   vllm-qwen122b   top chat — Qwen3.5-122B-A10B (vision, 128K, 78 GiB)
#   vllm-coder30b   coding — Qwen3-Coder-30B-A3B (FP8)
#   vllm-codernext  coding — Qwen3-Coder-Next-80B (FP8, 262K)
#   vllm-qwen27b    dense — Qwen3.6-27B
#   vllm-rerank     retrieval reranking — BAAI/bge-reranker-v2-m3
#   vllm-bgem3      retrieval embeddings — BAAI/bge-m3
#   vllm-whisper    transcription — openai/whisper-large-v3
#
# VLLM_<MODEL>_{MAX_LEN,GPU_UTIL,TP,DEVICES} are written by the scheduler.
# Devices go through NVIDIA_VISIBLE_DEVICES, never CUDA_VISIBLE_DEVICES (no
# "all" value; fails engine init on GB10).
name: kloudchat-vllm

services:
  vllm-qwen35b:
    container_name: vllm-qwen35b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    # One image for every vLLM service; install-vllm.sh builds it and records
    # VLLM_IMAGE and VLLM_BASE_IMAGE in .env.
    build:
      context: ./services/vllm
      args:
        BASE_IMAGE: ${VLLM_BASE_IMAGE:-vllm/vllm-openai:nightly-aarch64}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3.6-35b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_QWEN35B_MAX_LEN:-262144}"
      - --gpu-memory-utilization
      - "${VLLM_QWEN35B_GPU_UTIL:-0.55}"
      - --kv-cache-dtype
      - fp8
      # >= 16384 for the vision mm-budget
      - --max-num-batched-tokens
      - "${VLLM_QWEN35B_MAX_BATCHED_TOKENS:-16384}"
      # Qwen3.6 tool-call and <think> formats
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      # Thinking off by default; enabled per request via chat_template_kwargs
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      # Required: the hybrid model's conv-state cache bounds CUDA-graph capture
      - --max-num-seqs
      - "${VLLM_QWEN35B_MAX_NUM_SEQS:-128}"
      - --tensor-parallel-size
      - "${VLLM_QWEN35B_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_QWEN35B_DIR:-qwen3.6-35b-nvfp4}:/model:ro
    ports:
      - "8001:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_QWEN35B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # Top chat. Same parsers as vllm-qwen35b; 128K rather than the native 262K
  # because 78 GiB of weights leave ~22 GiB of KV.
  vllm-qwen122b:
    container_name: vllm-qwen122b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3.5-122b-a10b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_QWEN122B_MAX_LEN:-131072}"
      - --gpu-memory-utilization
      - "${VLLM_QWEN122B_GPU_UTIL:-0.85}"
      - --kv-cache-dtype
      - fp8
      - --max-num-batched-tokens
      - "${VLLM_QWEN122B_MAX_BATCHED_TOKENS:-16384}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      # 21.4 MiB of conv state per sequence out of a ~22 GiB pool
      - --max-num-seqs
      - "${VLLM_QWEN122B_MAX_NUM_SEQS:-32}"
      # 2 on 96 GiB cards, where the weights do not fit one
      - --tensor-parallel-size
      - "${VLLM_QWEN122B_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_QWEN122B_DIR:-qwen3.5-122b-a10b}:/model:ro
    ports:
      - "8004:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_QWEN122B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1200s

  # Coding. Qwen3-Coder's own tool dialect (`qwen3_coder`); no thinking mode.
  vllm-coder30b:
    container_name: vllm-coder30b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3-coder-30b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_CODER30B_MAX_LEN:-131072}"
      - --gpu-memory-utilization
      - "${VLLM_CODER30B_GPU_UTIL:-0.60}"
      - --kv-cache-dtype
      - fp8
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --tensor-parallel-size
      - "${VLLM_CODER30B_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_CODER30B_DIR:-qwen3-coder-30b}:/model:ro
    ports:
      - "8006:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_CODER30B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # Coding, larger. Hybrid attention: KV on 12 of 48 layers, so 262K fits.
  vllm-codernext:
    container_name: vllm-codernext
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3-coder-next
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_CODERNEXT_MAX_LEN:-262144}"
      - --gpu-memory-utilization
      - "${VLLM_CODERNEXT_GPU_UTIL:-0.85}"
      - --kv-cache-dtype
      - fp8
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --tensor-parallel-size
      - "${VLLM_CODERNEXT_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_CODERNEXT_DIR:-qwen3-coder-next}:/model:ro
    ports:
      - "8008:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      # 0 on GB10: DeepGEMM rejects this checkpoint's FP8 scale-factor layout
      VLLM_USE_DEEP_GEMM: ${VLLM_CODERNEXT_DEEP_GEMM:-0}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_CODERNEXT_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # Dense. Same parsers as vllm-qwen35b.
  vllm-qwen27b:
    container_name: vllm-qwen27b
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/qwen3.6-27b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_QWEN27B_MAX_LEN:-131072}"
      - --gpu-memory-utilization
      - "${VLLM_QWEN27B_GPU_UTIL:-0.45}"
      - --kv-cache-dtype
      - fp8
      - --max-num-batched-tokens
      - "${VLLM_QWEN27B_MAX_BATCHED_TOKENS:-16384}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --tensor-parallel-size
      - "${VLLM_QWEN27B_TP:-1}"
      - --trust-remote-code
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_QWEN27B_DIR:-qwen3.6-27b}:/model:ro
    ports:
      - "8007:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_QWEN27B_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # Retrieval reranking, /v1/rerank. Pooling runner; shares a card.
  vllm-rerank:
    container_name: vllm-rerank
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/bge-reranker-v2-m3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --runner
      - pooling
      # Query and passage share the window
      - --max-model-len
      - "${VLLM_RERANK_MAX_LEN:-8192}"
      - --gpu-memory-utilization
      - "${VLLM_RERANK_GPU_UTIL:-0.06}"
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_RERANK_DIR:-bge-reranker-v2-m3}:/model:ro
    ports:
      - "8009:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_RERANK_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Retrieval embeddings, /v1/embeddings. Pooling runner; shares a card.
  vllm-bgem3:
    container_name: vllm-bgem3
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      - --served-model-name
      - local/bge-m3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --runner
      - pooling
      - --max-model-len
      - "${VLLM_BGEM3_MAX_LEN:-8192}"
      - --gpu-memory-utilization
      - "${VLLM_BGEM3_GPU_UTIL:-0.08}"
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_BGEM3_DIR:-bge-m3}:/model:ro
    ports:
      - "8003:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_BGEM3_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Transcription, reached by whisper-shim through WHISPER_URLS. vLLM rather than
  # faster-whisper: ctranslate2 has no GPU wheels for aarch64.
  vllm-whisper:
    container_name: vllm-whisper
    image: ${VLLM_IMAGE:-kloudchat-vllm:local}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - /model
      # First name is what the shim sends; the aliases serve direct callers
      - --served-model-name
      - local/whisper-large-v3
      - whisper-1
      - whisper-large-v3
      - large-v3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Whisper's decoder window; longer audio is split server-side
      - --max-model-len
      - "${VLLM_WHISPER_MAX_LEN:-448}"
      - --gpu-memory-utilization
      - "${VLLM_WHISPER_GPU_UTIL:-0.14}"
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_WHISPER_DIR:-whisper-large-v3}:/model:ro
    ports:
      - "9000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_WHISPER_DEVICES:-all}
      # Upload ceiling in MB (vLLM default 25 rejects an hour of m4a)
      VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: ${WHISPER_MAX_UPLOAD_MB:-100}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
