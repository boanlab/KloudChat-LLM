name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      # Settings live in .shellcheckrc. SC1091 is excluded here because the
      # scripts source lib.sh at runtime.
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version | head -2
          shellcheck -S warning -e SC1091 scripts/*.sh

  python:
    name: Test scheduler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest ruff

      - name: Lint Python
        run: ruff check scheduler services

      - name: Scheduler and LiteLLM routing tests
        run: pytest scheduler/tests services/litellm/tests -q

  compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Real secrets, since compose interpolation rejects the placeholders.
      - name: Generate .env
        run: ./scripts/gen-env.sh

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.vllm.yml
        run: docker compose -f docker-compose.vllm.yml config --quiet

      - name: Verify pinned LiteLLM spend-log redaction
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/services/litellm/tests/verify_spend_log_redaction.py:/tmp/verify_spend_log_redaction.py:ro" \
            ghcr.io/berriai/litellm:v1.83.7-stable \
            /tmp/verify_spend_log_redaction.py

  images:
    name: Check image lists agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # An image is named in four places: the compose file that deploys it,
      # BUILD_TABLE in build-push-images.sh, the publish workflow's catalogue,
      # and the dropdown a manual publish picks from. Every one of those pairs
      # has drifted at least once, and none of them fails loudly when it does —
      # an image simply stops being built, or cannot be selected.
      - name: Compare the lists
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys

          wf = pathlib.Path(".github/workflows/publish-images.yml").read_text()
          sh = pathlib.Path("scripts/build-push-images.sh").read_text()

          catalogue = [e["image"] for e in
                       json.loads(re.search(r"catalogue='(\[.*?\])'", wf, re.S).group(1))]
          options = [o.strip() for o in
                     re.search(r"^\s*options: \[(.*?)\]", wf, re.M).group(1).split(",")]

          # Entries are "<short>|<dockerfile>|<context>[|<platform>]".
          def table(name):
              body = re.search(rf"^{name}=\((.*?)^\)", sh, re.S | re.M).group(1)
              return [e.split("|")[0] for e in re.findall(r'"([^"]+)"', body)]

          script = table("BUILD_TABLE") + table("MEDIA_TABLE")

          # kloudchat-vllm is upstream, built on the GPU nodes from ${VLLM_IMAGE}
          # and never pushed; keying on the namespace variable is what tells a
          # published image apart from that one.
          compose = sorted({
              m.group(1)
              for f in ("docker-compose.yml", "docker-compose.vllm.yml")
              for m in re.finditer(r"\$\{KLOUDCHAT_IMAGE_NS[^}]*\}/kloudchat-([a-z0-9-]+):",
                                   pathlib.Path(f).read_text())
          })

          problems = []
          if sorted(script) != sorted(catalogue):
              problems.append(f"build-push-images.sh {sorted(script)} != catalogue {sorted(catalogue)}")
          if [o for o in options if o != "all"] != catalogue:
              problems.append(f"workflow_dispatch options {options} != catalogue {catalogue} (order included)")
          if compose != sorted(catalogue):
              problems.append(f"compose images {compose} != catalogue {sorted(catalogue)}")

          print("\n".join(problems) or f"image lists agree: {catalogue}")
          sys.exit(1 if problems else 0)
          EOF

  docs:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Relative links and anchors only. External URLs are not fetched.
      - name: Check internal links
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          def slug(text):
              return re.sub(r"[^\w\s-]", "", text.strip().lower()).replace(" ", "-")

          headings = {}
          for path in pathlib.Path(".").rglob("*.md"):
              if ".git" in path.parts:
                  continue
              headings[str(path)] = {
                  slug(m.group(1))
                  for m in (re.match(r"#{1,6}\s+(.*)", line) for line in path.read_text().splitlines())
                  if m
              }

          broken = []
          for path in headings:
              text = pathlib.Path(path).read_text()
              for m in re.finditer(r"\]\((?!https?:|mailto:)([^)#]*)(?:#([^)]+))?\)", text):
                  target, anchor = m.group(1), (m.group(2) or "").lower()
                  base = pathlib.Path(path).parent
                  if target and not (base / target).resolve().exists():
                      broken.append(f"{path}: missing file {target}")
                      continue
                  resolved = path if not target else str((base / target).resolve().relative_to(pathlib.Path(".").resolve()))
                  if anchor and resolved in headings and anchor not in headings[resolved]:
                      broken.append(f"{path}: missing anchor {target}#{anchor}")

          print("\n".join(broken) or "All internal links resolve.")
          sys.exit(1 if broken else 0)
          EOF
