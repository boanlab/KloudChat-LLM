version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /services/whisper-shim
      - /services/crawl4ai-shim
      - /services/search-shim
      - /services/index-shim
      - /services/code-interpreter
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  # local-deep-research requires Python < 3.15
  - package-ecosystem: docker
    directory: /services/deep-research
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: python
        versions: [">=3.15"]
