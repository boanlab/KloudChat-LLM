version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /services/whisper-shim
      - /services/crawl4ai-shim
      - /services/search-shim
      - /services/index-shim
      - /services/code-interpreter
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  # deep-research stays on the Python its local-deep-research pin is tested with
  - package-ecosystem: docker
    directory: /services/deep-research
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: python
