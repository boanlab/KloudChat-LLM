# KloudChat-LLM — the backend plane the UI attaches to by URL.
#
# The gateway is the only externally published port; every other service exists
# on the internal network only. Path routing lives in services/gateway/Caddyfile.
#
#   docker compose up -d            # COMPOSE_PROFILES in .env chooses the mix
#
# Profiles
#   tools     gateway + web search, document fetch, code execution, deep research
#   models    LiteLLM and its database
#   whisper   transcription shim — setup.sh enables it once a backend answers
# Compose project name, which Docker requires in lower case.
name: kloudchat-llm

services:
  # ── gateway ─────────────────────────────────────────────────────────
  gateway:
    container_name: kloudchat-gateway
    image: caddy:2-alpine
    profiles: [tools]
    restart: always
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      # Internal keys injected upstream; they never leave the gateway
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-internal-shim-noauth}
      CODE_INTERPRETER_API_KEY: ${CODE_INTERPRETER_API_KEY:?the code execution API key is required}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [kloudchat]

  # ── model gateway ───────────────────────────────────────────────────
  litellm-db:
    container_name: kloudchat-litellm-db
    image: postgres:16.13
    profiles: [models]
    restart: always
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?the LiteLLM database password is required}
      POSTGRES_DB: litellm
    volumes:
      - ./data/litellm/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm} -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [kloudchat]

  litellm:
    container_name: kloudchat-litellm
    image: ghcr.io/berriai/litellm:v1.83.7-stable
    profiles: [models]
    restart: always
    depends_on:
      litellm-db:
        condition: service_healthy
    volumes:
      # :ro — a container-side rewrite would leave the host file root-owned
      - ./services/litellm/config.yaml:/app/config.yaml:ro
      - ./services/litellm/callbacks:/app/callbacks:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "8000"
      # ~600MB per worker
      - --num_workers
      - "${LITELLM_NUM_WORKERS:-4}"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?the LiteLLM master key is required}
      DATABASE_URL: "postgres://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      CONCURRENCY_GATE_CAPS: ${CONCURRENCY_GATE_CAPS:-}
      CONCURRENCY_GATE_TTL: ${CONCURRENCY_GATE_TTL:-1.5}
      CONCURRENCY_GATE_SCRAPE_TIMEOUT: ${CONCURRENCY_GATE_SCRAPE_TIMEOUT:-1.0}
      CONCURRENCY_GATE_DEBUG: ${CONCURRENCY_GATE_DEBUG:-}
      CONCURRENCY_GATE_FORCE: ${CONCURRENCY_GATE_FORCE:-}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveliness')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [kloudchat]

  # ── web search ──────────────────────────────────────────────────────
  valkey:
    container_name: kloudchat-valkey
    image: valkey/valkey:8-alpine
    profiles: [tools]
    restart: always
    # SearXNG worker shared state only; losing it on restart is harmless
    command: [valkey-server, --save, '', --appendonly, 'no']
    tmpfs: [/data]
    networks: [kloudchat]

  searxng:
    container_name: kloudchat-searxng
    image: searxng/searxng:2026.4.24-a7ac696b4
    profiles: [tools]
    restart: always
    depends_on: [valkey]
    environment:
      GRANIAN_WORKERS: '4'
    volumes:
      # :ro — a container-side write leaves the host file root-owned, after which
      # gen-searxng-config.sh cannot update it
      - ./services/searxng:/etc/searxng:ro
    tmpfs: [/var/cache/searxng]
    networks: [kloudchat]

  # ── document fetch ──────────────────────────────────────────────────
  crawl4ai-shim:
    container_name: kloudchat-crawl4ai-shim
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-crawl4ai-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/crawl4ai-shim
    profiles: [tools]
    restart: always
    environment:
      DEFAULT_TIMEOUT_MS: '30000'
      LOG_LEVEL: INFO
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [kloudchat]

  # ── code execution ──────────────────────────────────────────────────
  code-interpreter-redis:
    container_name: kloudchat-ci-redis
    image: redis:7.4.8-alpine
    profiles: [tools]
    restart: always
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - ./data/code-interpreter/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [kloudchat]

  code-interpreter-minio:
    container_name: kloudchat-ci-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [tools]
    restart: always
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${CODE_INTERPRETER_MINIO_USER:-code-interpreter}
      MINIO_ROOT_PASSWORD: ${CODE_INTERPRETER_MINIO_PASSWORD:?the code-interpreter MinIO password is required}
    volumes:
      - ./data/code-interpreter/minio:/data
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [kloudchat]

  code-interpreter-minio-init:
    container_name: kloudchat-ci-minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [tools]
    restart: 'no'
    depends_on:
      code-interpreter-minio:
        condition: service_healthy
    environment:
      CODE_INTERPRETER_MINIO_USER: ${CODE_INTERPRETER_MINIO_USER:-code-interpreter}
      CODE_INTERPRETER_MINIO_PASSWORD: ${CODE_INTERPRETER_MINIO_PASSWORD:?}
      CODE_INTERPRETER_MINIO_BUCKET: ${CODE_INTERPRETER_MINIO_BUCKET:-code-interpreter}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set myminio http://code-interpreter-minio:9000
        $${CODE_INTERPRETER_MINIO_USER} $${CODE_INTERPRETER_MINIO_PASSWORD};
        mc mb --ignore-existing myminio/$${CODE_INTERPRETER_MINIO_BUCKET};
        exit 0;
    networks: [kloudchat]

  code-interpreter:
    container_name: kloudchat-code-interpreter
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-code-interpreter:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/code-interpreter
    profiles: [tools]
    restart: always
    depends_on:
      code-interpreter-redis:
        condition: service_healthy
      code-interpreter-minio-init:
        condition: service_completed_successfully
    command: [sh, -c, 'mkdir -p /app/ssl && python3 -m src.main']
    environment:
      API_KEY: ${CODE_INTERPRETER_API_KEY:?the code execution API key is required}
      MAX_EXECUTION_TIME: '30'
      MAX_MEMORY_MB: '512'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SANDBOX_POOL_PARALLEL_BATCH: '1'
      REPL_WARMUP_TIMEOUT_SECONDS: '60'
      REDIS_HOST: code-interpreter-redis
      REDIS_PORT: '6379'
      S3_ENDPOINT: code-interpreter-minio:9000
      S3_ACCESS_KEY: ${CODE_INTERPRETER_MINIO_USER:-code-interpreter}
      S3_SECRET_KEY: ${CODE_INTERPRETER_MINIO_PASSWORD:?}
      S3_BUCKET: ${CODE_INTERPRETER_MINIO_BUCKET:-code-interpreter}
      S3_REGION: us-east-1
      S3_SECURE: 'false'
    # Isolated execution of user code; no other service gets these privileges
    cap_add: [SYS_ADMIN]
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    healthcheck:
      test: [CMD-SHELL, 'curl -fs http://localhost:8000/health || exit 1']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks: [kloudchat]

  # ── deep research ───────────────────────────────────────────────────
  # MCP streamable-http. Models come from the LiteLLM on this network.
  deep-research:
    container_name: kloudchat-deep-research
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-deep-research:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/deep-research
    profiles: [tools]
    restart: always
    depends_on: [searxng]
    environment:
      LDR_SEARCH_TOOL: searxng
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL: http://searxng:8080
      LDR_SEARCH_ITERATIONS: '2'
      LDR_SEARCH_QUESTIONS_PER_ITERATION: '1'
      LDR_LLM_PROVIDER: openai_endpoint
      LDR_LLM_OPENAI_ENDPOINT_URL: ${DEEP_RESEARCH_LLM_URL:-http://litellm:8000/v1}
      LDR_LLM_OPENAI_ENDPOINT_API_KEY: ${LITELLM_MASTER_KEY:-}
      LDR_LLM_MODEL: ${DEEP_RESEARCH_MODEL:-local/qwen3.6-35b}
    networks: [kloudchat]

  # ── transcription ───────────────────────────────────────────────────
  # Front end for faster-whisper on the GPU nodes, routing by in-flight count.
  # Profile-fenced: without a backend its healthcheck would still pass.
  whisper-shim:
    container_name: kloudchat-whisper-shim
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-whisper-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/whisper-shim
    profiles: [whisper]
    restart: always
    environment:
      WHISPER_URLS: ${WHISPER_URLS:-}
      # Headroom for transcribing long meeting recordings
      TRANSCRIBE_TIMEOUT_SEC: ${TRANSCRIBE_TIMEOUT_SEC:-3600}
      LOG_LEVEL: INFO
    healthcheck:
      # The shim's /health summarises backend state as "ok" or "degraded"
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:9000/health')); raise SystemExit(0 if d.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [kloudchat]

  # ── retrieval index ─────────────────────────────────────────────────
  # Vectors for RAG. Separate from litellm-db: LiteLLM's rows are the gateway's
  # own state, these are a derived index KloudChat can rebuild.
  index-db:
    container_name: kloudchat-index-db
    image: pgvector/pgvector:pg16
    profiles: [index]
    restart: always
    environment:
      POSTGRES_USER: ${INDEX_DB_USER:-index}
      POSTGRES_PASSWORD: ${INDEX_DB_PASSWORD:-index}
      POSTGRES_DB: index
    volumes:
      - ./data/index/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INDEX_DB_USER:-index} -d index"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [kloudchat]

  index-shim:
    container_name: kloudchat-index-shim
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-index-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/index-shim
    profiles: [index]
    restart: always
    depends_on:
      index-db:
        condition: service_healthy
    environment:
      INDEX_DATABASE_URL: postgresql://${INDEX_DB_USER:-index}:${INDEX_DB_PASSWORD:-index}@index-db:5432/index
      # Embeddings go through the gateway by model name: which backend answers
      # is LiteLLM's routing decision, not a second address to keep in step.
      LITELLM_URL: ${INDEX_LITELLM_URL:-http://litellm:8000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # Preference order: local when placed, commercial otherwise. Neither is
      # fatal — KloudChat falls back to lexical search.
      EMBED_MODELS: ${INDEX_EMBED_MODELS:-local/bge-m3,text-embedding-3-small}
      LOG_LEVEL: INFO
    healthcheck:
      # "ok" means the database answers. Embeddings are reported separately:
      # deletes keep working while the GPU node is down.
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8080/health')); raise SystemExit(0 if d.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [kloudchat]

networks:
  kloudchat:
    driver: bridge
