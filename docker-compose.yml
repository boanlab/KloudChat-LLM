# KloudChat-LLM backend plane. The gateway is the only published port; routing
# is in services/gateway/Caddyfile.
#
# Profiles (COMPOSE_PROFILES in .env)
#   tools     gateway, web search, document fetch, code execution, deep research
#   models    LiteLLM and its database
#   whisper   transcription shim; setup.sh adds it once a backend is placed
#   index     retrieval index (pgvector) and its shim
#   ocr       text from scanned pages (CPU)
#   imagegen  shim for self-hosted image models; setup.sh adds it once IMAGEGEN_BACKENDS is set
name: kloudchat-llm

# Container logs rotated per service; the host's daemon settings do not matter
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

services:
  # ── gateway ─────────────────────────────────────────────────────────
  gateway:
    container_name: kloudchat-gateway
    logging: *logging
    image: caddy:2-alpine
    profiles: [tools]
    restart: always
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      # Injected into upstream requests; never reach clients
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:?the document fetch shim key is required}
      CODE_INTERPRETER_API_KEY: ${CODE_INTERPRETER_API_KEY:?the code execution API key is required}
      # Required from clients on /tools/* as X-Tools-Key; unset or empty refuses to start
      TOOLS_GATEWAY_KEY: ${TOOLS_GATEWAY_KEY:?the tools gateway key is required (openssl rand -hex 32)}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [kloudchat, fetch]

  # GPU-node /metrics behind the gateway's /metrics/*; targets from the endpoint settings
  metrics-shim:
    container_name: kloudchat-metrics-shim
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-metrics-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/metrics-shim
    profiles: [tools]
    restart: always
    environment:
      VLLM_ENDPOINTS: ${VLLM_ENDPOINTS:-}
      VLLM_PLACED: ${VLLM_PLACED:-}
      WHISPER_URLS: ${WHISPER_URLS:-}
      IMAGEGEN_BACKENDS: ${IMAGEGEN_BACKENDS:-}
      VLLM_NODES: ${VLLM_NODES:-}
      GPU_EXPORTER_PORT: ${GPU_EXPORTER_PORT:-9835}
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [kloudchat]

  # ── model gateway ───────────────────────────────────────────────────
  litellm-db:
    container_name: kloudchat-litellm-db
    logging: *logging
    image: postgres:16.13
    profiles: [models]
    restart: always
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?the LiteLLM database password is required}
      POSTGRES_DB: litellm
    volumes:
      - ./data/litellm/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm} -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [litellm-data]

  litellm:
    container_name: kloudchat-litellm
    logging: *logging
    image: ghcr.io/berriai/litellm:v1.83.7-stable
    profiles: [models]
    restart: always
    depends_on:
      litellm-db:
        condition: service_healthy
    volumes:
      - ./services/litellm/config.yaml:/app/config.yaml:ro
      - ./services/litellm/callbacks:/app/callbacks:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "8000"
      # ~600MB per worker
      - --num_workers
      - "${LITELLM_NUM_WORKERS:-4}"
      # Gunicorn supervises the workers (600 s heartbeat). Uvicorn's own
      # supervisor kills a worker that misses a 5 s ping, which a worker
      # stalled on swap-in does, and every stream on it dies mid-answer.
      # Preloaded workers also share the imported code (copy-on-write).
      - --run_gunicorn
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?the LiteLLM master key is required}
      DATABASE_URL: "postgres://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      CONCURRENCY_GATE_CAPS: ${CONCURRENCY_GATE_CAPS:-}
      CONCURRENCY_GATE_TTL: ${CONCURRENCY_GATE_TTL:-1.5}
      CONCURRENCY_GATE_SCRAPE_TIMEOUT: ${CONCURRENCY_GATE_SCRAPE_TIMEOUT:-1.0}
      CONCURRENCY_GATE_DEBUG: ${CONCURRENCY_GATE_DEBUG:-}
      CONCURRENCY_GATE_FORCE: ${CONCURRENCY_GATE_FORCE:-}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveliness')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [kloudchat, litellm-data]

  # ── web search ──────────────────────────────────────────────────────
  valkey:
    container_name: kloudchat-valkey
    logging: *logging
    image: valkey/valkey:8-alpine
    profiles: [tools]
    restart: always
    # SearXNG shared state; ephemeral
    command: [valkey-server, --save, '', --appendonly, 'no']
    tmpfs: [/data]
    networks: [searxng-data]

  searxng:
    container_name: kloudchat-searxng
    logging: *logging
    image: searxng/searxng:2026.4.24-a7ac696b4
    profiles: [tools]
    restart: always
    depends_on: [valkey]
    environment:
      GRANIAN_WORKERS: '4'
    volumes:
      - ./services/searxng:/etc/searxng:ro
    tmpfs: [/var/cache/searxng]
    networks: [kloudchat, searxng-data]

  # In front of SearXNG: result cache, coalesced duplicate searches, in-flight
  # cap; the engines ban on burst from one address
  search-shim:
    container_name: kloudchat-search-shim
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-search-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/search-shim
    profiles: [tools]
    restart: always
    depends_on: [searxng]
    environment:
      SEARXNG_URL: http://searxng:8080
      # Concurrent SearXNG searches; the rest wait QUEUE_TIMEOUT_MS, then are
      # refused. A result is reused for CACHE_TTL_S, and up to STALE_TTL_S while
      # SearXNG cannot answer.
      MAX_CONCURRENT_SEARCHES: '12'
      QUEUE_TIMEOUT_MS: '10000'
      CACHE_TTL_S: '900'
      STALE_TTL_S: '21600'
      # Forced on every search, whatever the caller sent (2 = strict)
      SAFESEARCH: '2'
      LOG_LEVEL: INFO
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [kloudchat]

  # ── document fetch ──────────────────────────────────────────────────
  crawl4ai-shim:
    container_name: kloudchat-crawl4ai-shim
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-crawl4ai-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/crawl4ai-shim
    profiles: [tools]
    restart: always
    environment:
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:?}
      DEFAULT_TIMEOUT_MS: '30000'
      # Pages rendering at once in the one Chromium; the rest wait
      # QUEUE_TIMEOUT_MS, then are refused. A good scrape is reused for CACHE_TTL_S.
      MAX_CONCURRENT_PAGES: '8'
      QUEUE_TIMEOUT_MS: '15000'
      CACHE_TTL_S: '900'
      # Ceiling on a caller's timeout, and the largest scrape the cache keeps
      MAX_TIMEOUT_MS: '60000'
      CACHE_MAX_ENTRY_BYTES: '2097152'
      LOG_LEVEL: INFO
    # /health is 503 once the browser cannot render; a shim whose restarts do
    # not help exits, and restart: always starts it again
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # One Chromium with MAX_CONCURRENT_PAGES pages, plus the page cache
    mem_limit: 4g
    # Shared with the gateway alone: page scripts reach no other service
    networks: [fetch]

  # ── code execution ──────────────────────────────────────────────────
  code-interpreter-redis:
    container_name: kloudchat-ci-redis
    logging: *logging
    image: redis:7.4.8-alpine
    profiles: [tools]
    restart: always
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - ./data/code-interpreter/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [code-interpreter-data]

  code-interpreter-minio:
    container_name: kloudchat-ci-minio
    logging: *logging
    image: boanlab/minio:2025-09-07
    profiles: [tools]
    restart: always
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${CODE_INTERPRETER_MINIO_USER:-code-interpreter}
      MINIO_ROOT_PASSWORD: ${CODE_INTERPRETER_MINIO_PASSWORD:?the code-interpreter MinIO password is required}
    volumes:
      - ./data/code-interpreter/minio:/data
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [code-interpreter-data]

  code-interpreter-minio-init:
    container_name: kloudchat-ci-minio-init
    logging: *logging
    image: boanlab/mc:2025-08-13
    profiles: [tools]
    restart: 'no'
    depends_on:
      code-interpreter-minio:
        condition: service_healthy
    environment:
      CODE_INTERPRETER_MINIO_USER: ${CODE_INTERPRETER_MINIO_USER:-code-interpreter}
      CODE_INTERPRETER_MINIO_PASSWORD: ${CODE_INTERPRETER_MINIO_PASSWORD:?}
      CODE_INTERPRETER_MINIO_BUCKET: ${CODE_INTERPRETER_MINIO_BUCKET:-code-interpreter}
    entrypoint:
      - /bin/sh
      - -c
      # Any failed step fails the init, and code-interpreter waits on it
      - >
        set -e;
        mc alias set myminio http://code-interpreter-minio:9000
        $${CODE_INTERPRETER_MINIO_USER} $${CODE_INTERPRETER_MINIO_PASSWORD};
        mc mb --ignore-existing myminio/$${CODE_INTERPRETER_MINIO_BUCKET};
        mc ls myminio/$${CODE_INTERPRETER_MINIO_BUCKET} >/dev/null
    networks: [code-interpreter-data]

  code-interpreter:
    container_name: kloudchat-code-interpreter
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-code-interpreter:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/code-interpreter
    profiles: [tools]
    restart: always
    depends_on:
      code-interpreter-redis:
        condition: service_healthy
      code-interpreter-minio-init:
        condition: service_completed_successfully
    # cgroup-init (services/code-interpreter/bin) enables per-sandbox cgroups before the service starts
    command: [cgroup-init, sh, -c, 'mkdir -p /app/ssl && python3 -m src.main']
    environment:
      API_KEY: ${CODE_INTERPRETER_API_KEY:?the code execution API key is required}
      MAX_EXECUTION_TIME: '30'
      # Per-sandbox cgroup memory.max (no swap), enforced by nsjail-memcg; a warm
      # pandas/numpy REPL takes ~260 MB of it. Over it the sandbox is killed
      MAX_MEMORY_MB: '1024'
      # Per sandbox: processes (fork bombs), and CPU ms per second (1000 = one core)
      MAX_SANDBOX_PIDS: '256'
      MAX_SANDBOX_CPU_MS: '1000'
      NSJAIL_BINARY: /usr/local/bin/nsjail-memcg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SANDBOX_POOL_PARALLEL_BATCH: '1'
      REPL_WARMUP_TIMEOUT_SECONDS: '60'
      REDIS_HOST: code-interpreter-redis
      REDIS_PORT: '6379'
      S3_ENDPOINT: code-interpreter-minio:9000
      S3_ACCESS_KEY: ${CODE_INTERPRETER_MINIO_USER:-code-interpreter}
      S3_SECRET_KEY: ${CODE_INTERPRETER_MINIO_PASSWORD:?}
      S3_BUCKET: ${CODE_INTERPRETER_MINIO_BUCKET:-code-interpreter}
      S3_REGION: us-east-1
      S3_SECURE: 'false'
    # Sandbox for user code; the only service with these privileges
    cap_add: [SYS_ADMIN]
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    # Whole container: API (~100-300 MB), 2 warm REPLs (~260 MB each), a few
    # sandboxes at MAX_MEMORY_MB; no swap
    mem_limit: 4g
    memswap_limit: 4g
    # Whole container: processes and cores across every sandbox
    pids_limit: 2048
    cpus: ${CODE_INTERPRETER_CPUS:-4}
    healthcheck:
      test: [CMD-SHELL, 'curl -fs http://localhost:8000/health || exit 1']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks: [kloudchat, code-interpreter-data]

  # ── deep research ───────────────────────────────────────────────────
  # MCP streamable-http; models through LiteLLM
  deep-research:
    container_name: kloudchat-deep-research
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-deep-research:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/deep-research
    profiles: [tools]
    restart: always
    depends_on: [search-shim]
    environment:
      LDR_SEARCH_TOOL: searxng
      # Through the search shim, so its cache and cap cover research too
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL: http://search-shim:8080
      LDR_SEARCH_ITERATIONS: '2'
      LDR_SEARCH_QUESTIONS_PER_ITERATION: '1'
      LDR_LLM_PROVIDER: openai_endpoint
      LDR_LLM_OPENAI_ENDPOINT_URL: ${DEEP_RESEARCH_LLM_URL:-http://litellm:8000/v1}
      LDR_LLM_OPENAI_ENDPOINT_API_KEY: ${LITELLM_MASTER_KEY:-}
      # A model id runs as local/<id>; a name with a slash is used as written
      LDR_LLM_MODEL: ${DEEP_RESEARCH_MODEL:-qwen3.8-27b}
    command:
      - sh
      - -c
      - |
        case "$$LDR_LLM_MODEL" in */*) ;; *) LDR_LLM_MODEL="local/$$LDR_LLM_MODEL"; export LDR_LLM_MODEL ;; esac
        exec mcp-proxy --pass-environment --port=8081 --host=0.0.0.0 --transport=streamablehttp ldr-mcp
    mem_limit: 2g
    # An MCP initialize answered by the research server behind mcp-proxy
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; r=urllib.request.Request('http://localhost:8081/mcp', data=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'healthcheck','version':'1'}}}).encode(), headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}); urllib.request.urlopen(r, timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [kloudchat]

  # ── transcription ───────────────────────────────────────────────────
  # Front end for the vllm-whisper backends, least-busy routing
  whisper-shim:
    container_name: kloudchat-whisper-shim
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-whisper-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/whisper-shim
    profiles: [whisper]
    restart: always
    environment:
      WHISPER_URLS: ${WHISPER_URLS:-}
      VLLM_PLACED: ${VLLM_PLACED:-}
      TRANSCRIBE_TIMEOUT_SEC: ${TRANSCRIBE_TIMEOUT_SEC:-3600}
      # Largest upload (413 past it), and transcriptions at once (503 past it)
      WHISPER_MAX_UPLOAD_MB: ${WHISPER_MAX_UPLOAD_MB:-100}
      WHISPER_MAX_CONCURRENT: ${WHISPER_MAX_CONCURRENT:-8}
      LOG_LEVEL: INFO
    # Uploads held in memory: WHISPER_MAX_CONCURRENT × WHISPER_MAX_UPLOAD_MB at most
    mem_limit: 2g
    healthcheck:
      # "ok" while at least one backend answers
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:9000/health')); raise SystemExit(0 if d.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [kloudchat]

  imagegen-shim:
    container_name: kloudchat-imagegen-shim
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-imagegen-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/imagegen-shim
    profiles: [imagegen]
    restart: always
    environment:
      IMAGEGEN_BACKENDS: ${IMAGEGEN_BACKENDS:-}
      LOG_LEVEL: INFO
    healthcheck:
      # "ok" while at least one backend answers
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:9100/health')); raise SystemExit(0 if d.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [kloudchat]

  # ── retrieval index ─────────────────────────────────────────────────
  # Vectors for RAG; derived data, rebuildable
  index-db:
    container_name: kloudchat-index-db
    logging: *logging
    image: pgvector/pgvector:pg16
    profiles: [index]
    restart: always
    environment:
      POSTGRES_USER: ${INDEX_DB_USER:-index}
      POSTGRES_PASSWORD: ${INDEX_DB_PASSWORD:?the retrieval index database password is required}
      POSTGRES_DB: index
    volumes:
      - ./data/index/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INDEX_DB_USER:-index} -d index"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [index-data]

  index-shim:
    container_name: kloudchat-index-shim
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-index-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/index-shim
    profiles: [index]
    restart: always
    depends_on:
      index-db:
        condition: service_healthy
    environment:
      INDEX_DATABASE_URL: postgresql://${INDEX_DB_USER:-index}:${INDEX_DB_PASSWORD}@index-db:5432/index
      LITELLM_URL: ${INDEX_LITELLM_URL:-http://litellm:8000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # Local only; with none available KloudChat falls back to lexical search
      EMBED_MODELS: ${INDEX_EMBED_MODELS:-strict-local/bge-m3}
      # Second retrieval stage; empty skips it
      RERANK_MODEL: ${INDEX_RERANK_MODEL-strict-local/bge-reranker-v2-m3}
      RERANK_CANDIDATES: ${INDEX_RERANK_CANDIDATES:-5}
      RERANK_MIN_SCORE: ${INDEX_RERANK_MIN_SCORE:-0.1}
      RERANK_RECALL_DISTANCE: ${INDEX_RERANK_RECALL_DISTANCE:-0.85}
      LOG_LEVEL: INFO
    mem_limit: 2g
    healthcheck:
      # "ok" = database answers; embeddings reported separately
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8080/health')); raise SystemExit(0 if d.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [kloudchat, index-data]

  # ── text from scanned pages ─────────────────────────────────────────
  # PaddleOCR PP-OCRv5 (Korean) on CPU; models baked into the image, no egress
  ocr-shim:
    container_name: kloudchat-ocr-shim
    logging: *logging
    image: ${KLOUDCHAT_IMAGE_NS:-boanlab}/kloudchat-ocr-shim:${KLOUDCHAT_IMAGE_TAG:-latest}
    build:
      context: ./services/ocr-shim
    profiles: [ocr]
    restart: always
    environment:
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-1}
      OCR_THREADS: ${OCR_THREADS:-4}
      OCR_MAX_BODY_MB: ${OCR_MAX_BODY_MB:-64}
      OCR_DPI: ${OCR_DPI:-200}
      LOG_LEVEL: INFO
    # Pages are recognised on these cores; chat and the GPUs are not touched
    cpus: ${OCR_CPUS:-4}
    mem_limit: ${OCR_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8080/health')); raise SystemExit(0 if d.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [kloudchat]

networks:
  # Service plane behind the gateway
  kloudchat:
    driver: bridge
  # Gateway and the document fetch shim only; the shim's browser runs untrusted pages
  fetch:
    driver: bridge

  # Backing stores, reachable only by their owning service; no outbound traffic
  litellm-data:
    driver: bridge
    internal: true
  index-data:
    driver: bridge
    internal: true
  code-interpreter-data:
    driver: bridge
    internal: true
  searxng-data:
    driver: bridge
    internal: true
