# Lint and test settings. The scheduler is a plain package run as
# `python3 -m scheduler`; there is no build system.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["services/deep-research/patches"]

[tool.ruff.lint]
# Pyflakes, the pycodestyle subset that catches mistakes, isort, bugbear.
# No `UP`: the code keeps `Optional[...]` under `from __future__ import annotations`.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
  "B008",  # frozen dataclass defaults in keyword-only arguments (scheduler.applier)
]

[tool.pytest.ini_options]
testpaths = ["scheduler/tests", "services/litellm/tests"]
pythonpath = ["."]
