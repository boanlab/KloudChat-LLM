# Models vLLM can serve. VLLM_MODELS in .env selects which are deployed.
#
# Undeclared fields: derived from the checkpoint's config.json and size on disk
# (see "Derived values" at the bottom).
#
# placement: "head" = first target in VLLM_NODES; "pool" = every other node;
# "head-first" = the first instance on the head, extra ones on any node;
# unset = anywhere. Ignored on a single-node cluster.

models:
  # Chat: conversation, vision, coding, deep research, titles, memory
  # extraction. Dense, hybrid attention (16 of 64 layers hold KV), NVFP4.
  # Replicated onto every node with room.
  - id: qwen3.8-27b
    hf_repo: unsloth/Qwen3.8-27B-NVFP4
    dir: qwen3.8-27b-nvfp4
    env_prefix: VLLM_QWEN27B
    port: 8001
    # Native context as the floor: no shorter window
    ctx_floor: 262144
    priority: 20
    openrouter: qwen/qwen3.8-27b
    # Deep research runs for minutes
    timeout: 3600
    # --max-num-seqs
    max_inflight: 128
    # Repeats list items without it; vLLM's --override-generation-config ignores
    # presence_penalty. KC_QWEN27B_PRESENCE_PENALTY overrides, empty sends none
    presence_penalty: 1.0

  # Quality and judging: hard questions, review, grading. MoE (512 experts, 10
  # active), hybrid attention (12 of 48 layers hold KV), NVFP4 body, FP8 PLE
  # table (48 GiB; page cache on GB10, pinned system RAM on a discrete card). A
  # pool node to itself; seated before the 27B.
  - id: qwen3.8-flash
    hf_repo: nvidia/Qwen3.8-Flash-Next-NVFP4
    dir: qwen3.8-flash-next-nvfp4
    env_prefix: VLLM_QWENFLASH
    port: 8004
    # Resident size; PLE table off the GPU budget
    weight: 78.3GiB
    # Measured on GB10; below the 10 GiB default, so one RTX PRO 6000 seats it
    activation: 6GiB
    # Half the native 262144; room spent on concurrency
    ctx_floor: 131072
    ctx_target: 131072
    # util 0.81 on a GB10 (773K-token KV); 2 sessions on one RTX PRO 6000 (0.92)
    concurrent_sessions: 8
    priority: 30
    placement: pool
    openrouter: qwen/qwen3.8-flash
    timeout: 3600
    # --max-num-seqs
    max_inflight: 16

  # Coding. 80B-A3B, FP8, hybrid attention (12 of 48 layers hold KV), 75 GiB:
  # a pool card to itself. Not in the default VLLM_MODELS.
  - id: qwen3-coder-next
    hf_repo: Qwen/Qwen3-Coder-Next-FP8
    dir: qwen3-coder-next
    env_prefix: VLLM_CODERNEXT
    port: 8008
    priority: 10
    placement: pool
    openrouter: qwen/qwen3-coder-next
    max_inflight: 32

  # Run by hand (VLLM_ENDPOINTS), never deployed; listed for the OpenRouter
  # fallback and the timeout.
  - id: deepseek-v4-flash
    manual: true
    env_prefix: VLLM_DSFLASH
    openrouter: deepseek/deepseek-v4-flash
    timeout: 3600

  # Transcription, behind whisper-shim (/tools/stt). Audio stays inside the
  # network: with no backend, dictation is off, with no OpenRouter route.
  - id: whisper-large-v3
    hf_repo: openai/whisper-large-v3
    dir: whisper-large-v3
    env_prefix: VLLM_WHISPER
    # whisper-shim's backend port
    port: 9000
    runner: transcription
    placement: head-first
    # Below bge-m3
    priority: 4
    # 448-token decoder context; longer audio split server-side
    concurrent_sessions: 4

  # Retrieval reranking: second stage over vector search
  - id: bge-reranker-v2-m3
    hf_repo: BAAI/bge-reranker-v2-m3
    env_prefix: VLLM_RERANK
    port: 8009
    runner: pooling
    api: rerank
    # Query and passage share the window
    ctx_floor: 8192
    priority: 2
    placement: head-first

  # Retrieval embeddings
  - id: bge-m3
    hf_repo: BAAI/bge-m3
    env_prefix: VLLM_BGEM3
    port: 8003
    runner: pooling
    # Above whisper and the reranker: the whole retrieval path
    priority: 5
    placement: head-first
    # One chunk at a time
    ctx_floor: 8192

# ── Derived values ──────────────────────────────────────────────────────────
#
# Declaring a field of the same name on an entry overrides the derived value.
#
#   dir             = id                    checkpoint directory under VLLM_MODELS_ROOT
#   weight          measured size on disk
#   ctx_target      max_position_embeddings from config.json
#   ctx_floor       ctx_target / 4, never below 32768
#   concurrent_sessions 4                    full-length sessions KV is sized for;
#                                            halved on a card without room
#   service         env_prefix lowercased    service in docker-compose.vllm.yml
#   port            sequential from 8001     declared on every entry so an
#                                            insertion does not shift the rest
#   arches          all                      declare only to exclude one
#   runner          generate                 "pooling" for embedding and reranking,
#                                            "transcription" for the STT backend
#   tensor_parallel 1                        cards to shard across on one node
#   activation      10 GiB (2 GiB pooling),  runtime headroom per card
#                   at most 12% of the card
#   priority        0                        placement order, highest first;
#                                            ties seat the largest first
#   placement       any                      "head", "head-first", "pool", or any node
#   share           1                        weight for extra instances, among
#                                            models competing for the same nodes
#   replicas        unlimited                cap on the model's instances, external
#                                            ones (VLLM_ENDPOINTS) included; 1 keeps
#                                            it to one. Unset, spare capacity takes
#                                            extra instances by share
#
#   manual          false                    run by hand: no hf_repo needed, never
#                                            placed, and VLLM_MODELS cannot select it
#
# LiteLLM registration (gen-litellm-config.sh):
#
#   api             from runner              chat (generate), embedding (pooling),
#                                            transcription; "rerank" for a reranker
#   openrouter      none                     OpenRouter slug: the spill and fallback
#                                            target, and the route with no vLLM
#   timeout         LiteLLM default          request timeout in seconds
#   max_inflight    256                      requests running per node before
#                                            local/ spills and strict-local/ refuses
#   presence_penalty none                    default on the vLLM deployment;
#                                            KC_<env_prefix without VLLM_>_PRESENCE_PENALTY
#                                            overrides
#
# A vLLM in VLLM_ENDPOINTS serving a model not listed here registers as chat
# with these defaults.
