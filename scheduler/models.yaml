# Models vLLM can serve. VLLM_MODELS in .env selects which of them are deployed.
#
# Fields not declared here are derived from the checkpoint's config.json and its
# size on disk — see "Derived values" at the bottom of this file.
#
# Transcription is absent: it is resident on amd64 GPU nodes, so placement has
# nothing to decide and only subtracts its footprint from node capacity
# (__main__.WHISPER_RESERVE_BYTES).

models:
  # Unified chat and floor: default chat, titles, memory extraction, deep
  # research, coding agents. Highest priority — every default route lands here.
  - id: qwen3.6-35b
    hf_repo: Qwen/Qwen3.6-35B-A3B
    openrouter: qwen/qwen3.6-35b-a3b
    # NVFP4 build; an unquantised checkpoint of the same id exists separately.
    dir: qwen3.6-35b-nvfp4
    env_prefix: VLLM_QWEN35B
    port: 8001
    # Deep research floor: accumulated context is lost below 128K.
    ctx_floor: 131072
    priority: 20

  # Coding. 80B total, 3B active, hybrid attention — 12 of 48 layers hold KV, so
  # 12 KiB/token and an affordable 262K. FP8: serves on a card without FP4.
  - id: qwen3-coder-next
    hf_repo: Qwen/Qwen3-Coder-Next-FP8
    openrouter: qwen/qwen3-coder-next
    dir: qwen3-coder-next
    env_prefix: VLLM_CODERNEXT
    port: 8008
    priority: 15

  # Top chat: 10B active, ~3x the decode cost of the 35B. Needs a card to itself.
  - id: qwen3.5-122b-a10b
    hf_repo: Qwen/Qwen3.5-122B-A10B-NVFP4
    openrouter: qwen/qwen3.5-122b-a10b
    dir: qwen3.5-122b-a10b
    env_prefix: VLLM_QWEN122B
    port: 8004
    # 128K rather than native 262K: 78 GiB of weights leaves ~22 GiB for KV on a
    # GB10, and at 12 KiB/token that is depth or concurrency — docs/gpu-memory.md.
    ctx_target: 131072
    ctx_floor: 131072
    # The card serves nothing else; size the KV pool for real concurrency.
    concurrent_sessions: 12
    # Cards to shard across on one node. 1 fits a 121.6 GiB GB10 whole. A 96 GiB
    # card needs 2, which also buys back the native 256K — a sharded model takes
    # those cards outright, so such a host serves this or qwen3.6-35b, not both.
    tensor_parallel: 1
    priority: 10

  # Cheap-decode floor (31.2B-A3B).
  - id: glm-4.7-flash
    hf_repo: zai-org/GLM-4.7-Flash
    openrouter: z-ai/glm-4.7-flash
    env_prefix: VLLM_GLMFLASH
    port: 8002

  # A second family: an alternative when a Qwen answer is wrong. 4B active of 26B.
  - id: gemma-4-26b-a4b
    hf_repo: google/gemma-4-26B-A4B-it
    openrouter: google/gemma-4-26b-a4b-it
    dir: gemma-4-26b
    env_prefix: VLLM_GEMMA26B
    port: 8005
    # Below the derived 64K: an alternative to reach for, not a long-context
    # workhorse. Restoration grows it where there is room.
    ctx_floor: 32768

  # Coding, smaller. FP8. Superseded by qwen3-coder-next where 75 GiB fits.
  - id: qwen3-coder-30b
    hf_repo: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
    openrouter: qwen/qwen3-coder-30b-a3b-instruct
    dir: qwen3-coder-30b
    env_prefix: VLLM_CODER30B
    port: 8006
    # 48 full-attention layers at 48 KiB/token, the most KV-expensive here.
    ctx_floor: 32768

  # The one dense model: slower per token, but it does not route.
  - id: qwen3.6-27b
    hf_repo: Qwen/Qwen3.6-27B
    openrouter: qwen/qwen3.6-27b
    dir: qwen3.6-27b
    env_prefix: VLLM_QWEN27B
    port: 8007
    ctx_floor: 32768

  # Retrieval reranking: second stage over what the vector search returns.
  - id: bge-reranker-v2-m3
    hf_repo: BAAI/bge-reranker-v2-m3
    env_prefix: VLLM_RERANK
    port: 8009
    runner: pooling
    # Query and passage share the window.
    ctx_floor: 8192

  # Retrieval embeddings. No openrouter twin — OpenRouter serves no embedding
  # model; the OpenAI fallback is wired in gen-litellm-config.sh.
  - id: bge-m3
    hf_repo: BAAI/bge-m3
    env_prefix: VLLM_BGEM3
    port: 8003
    runner: pooling
    # Above the optional chat models: 6 GiB, and the whole retrieval path.
    # Delegating it does not move it elsewhere, it turns /tools/index into
    # lexical matching. Not higher — 6 GiB must not displace a card-sized model.
    priority: 5
    # One chunk at a time.
    ctx_floor: 8192

# ── Derived values ──────────────────────────────────────────────────────────
#
# Declaring a field of the same name on an entry overrides the derived value.
#
#   dir             = id                    checkpoint directory under VLLM_MODELS_ROOT
#   weight          measured size on disk
#   ctx_target      max_position_embeddings from config.json
#   ctx_floor       ctx_target / 4, never below 32768
#   service         env_prefix lowercased    service in docker-compose.vllm.yml
#   port            sequential from 8001     declared on every entry: the derived
#                                            value shifts when one is inserted
#   served_name     local/<id>               the name LiteLLM exposes
#   arches          all                      declare only to exclude one
#   runner          generate                 "pooling" for embedding and reranking
#   tensor_parallel 1                        cards to shard across on one node
#   priority        0                        placement order, highest first;
#                                            ties fall back to largest-first
