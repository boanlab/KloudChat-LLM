# Models vLLM can serve. VLLM_MODELS in .env selects which are deployed.
#
# Undeclared fields are derived from the checkpoint's config.json and its size
# on disk — see "Derived values" at the bottom.
#
# placement: "head" is the first target in NODES_VLLM (default chat, retrieval,
# transcription); "pool" is every other node (large picker models); unset is
# anywhere. A single-node cluster has no pool and the field is ignored.

models:
  # Unified chat: default chat, titles, memory extraction, deep research,
  # coding agents. Dense, hybrid attention (16 of 64 layers hold KV). NVFP4
  # build. Any node; spare cards take replicas that LiteLLM balances across.
  - id: qwen3.8-27b
    hf_repo: Qwen/Qwen3.8-27B
    dir: qwen3.8-27b-nvfp4
    env_prefix: VLLM_QWEN27B
    port: 8001
    # The native context is the floor: a node that cannot hold 256K delegates
    # rather than serving a shorter window
    ctx_floor: 262144
    priority: 20

  # Coding. 80B-A3B, FP8, hybrid attention (12 of 48 layers hold KV). 75 GiB,
  # so it takes a pool card to itself.
  - id: qwen3-coder-next
    hf_repo: Qwen/Qwen3-Coder-Next-FP8
    dir: qwen3-coder-next
    env_prefix: VLLM_CODERNEXT
    port: 8008
    priority: 10
    placement: pool

  # Transcription. Reached through whisper-shim at /tools/stt, not a LiteLLM
  # chat route; LiteLLM registers OpenRouter STT only while WHISPER_URLS is empty.
  - id: whisper-large-v3
    hf_repo: openai/whisper-large-v3
    dir: whisper-large-v3
    env_prefix: VLLM_WHISPER
    # whisper-shim addresses its backends on 9000
    port: 9000
    runner: transcription
    placement: head
    # Below bge-m3: losing this falls back to OpenRouter, losing embeddings
    # degrades /tools/index to lexical search
    priority: 4
    # Decoder context is 448 tokens; longer audio is split server-side
    concurrent_sessions: 4

  # Retrieval reranking: second stage over vector search
  - id: bge-reranker-v2-m3
    hf_repo: BAAI/bge-reranker-v2-m3
    env_prefix: VLLM_RERANK
    port: 8009
    runner: pooling
    # Query and passage share the window
    ctx_floor: 8192
    placement: head

  # Retrieval embeddings. OpenAI fallback wired in gen-litellm-config.sh.
  - id: bge-m3
    hf_repo: BAAI/bge-m3
    env_prefix: VLLM_BGEM3
    port: 8003
    runner: pooling
    # Above the optional chat models (6 GiB, the whole retrieval path); below
    # the card-sized ones
    priority: 5
    placement: head
    # One chunk at a time
    ctx_floor: 8192

# ── Derived values ──────────────────────────────────────────────────────────
#
# Declaring a field of the same name on an entry overrides the derived value.
#
#   dir             = id                    checkpoint directory under VLLM_MODELS_ROOT
#   weight          measured size on disk
#   ctx_target      max_position_embeddings from config.json
#   ctx_floor       ctx_target / 4, never below 32768
#   service         env_prefix lowercased    service in docker-compose.vllm.yml
#   port            sequential from 8001     declared on every entry so an
#                                            insertion does not shift the rest
#   served_name     local/<id>               the name LiteLLM exposes
#   arches          all                      declare only to exclude one
#   runner          generate                 "pooling" for embedding and reranking,
#                                            "transcription" for the STT backend
#   tensor_parallel 1                        cards to shard across on one node
#   priority        0                        placement order, highest first;
#                                            ties seat the largest first
#   placement       any                      "head", "pool", or any node
#   share           1                        weight for extra instances, among
#                                            models competing for the same nodes
