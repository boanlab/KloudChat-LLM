# GPU-node vllm-omni models (image generation). Started by hand with
# scripts/manage-vllm-omni.sh, not by the scheduler; LiteLLM reaches them through
# imagegen-shim, which reads IMAGEGEN_BACKENDS in the orchestrator's .env:
#
#   IMAGEGEN_BACKENDS=local/z-image-turbo=http://<node>:8091,local/qwen-image-2512=http://<node>:8092
#
#   omni-z-image     Z-Image-Turbo — fast, ~25 GiB while serving
#   omni-qwen-image  Qwen-Image-2512 — slower, better layout, ~55 GiB of weights
#
# The scheduler neither places nor starts these; it charges the memory they
# hold (nvidia-smi) to their card, so start them before `scheduler apply`.
# Container names start with omni-, never vllm-: the scheduler owns vllm-* and
# stops any it did not place.
name: kloudchat-vllm-omni

x-vllm-omni: &vllm-omni
  # vllm-omni: diffusion serving behind the OpenAI chat API (modalities image).
  # Pinned; arm64 and amd64.
  image: ${VLLM_OMNI_IMAGE:-vllm/vllm-omni:v0.30.0}
  restart: unless-stopped
  ipc: host
  entrypoint: [vllm]
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    NVIDIA_VISIBLE_DEVICES: ${VLLM_OMNI_DEVICES:-all}
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  omni-z-image:
    <<: *vllm-omni
    container_name: omni-z-image
    command:
      - serve
      - /model
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --served-model-name
      - local/z-image-turbo
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_OMNI_ZIMAGE_DIR:-z-image-turbo}:/model:ro
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8091/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  omni-qwen-image:
    <<: *vllm-omni
    container_name: omni-qwen-image
    command:
      - serve
      - /model
      - --omni
      - --host
      - 0.0.0.0
      - --port
      - "8092"
      - --served-model-name
      - local/qwen-image-2512
    volumes:
      - ${VLLM_MODELS_ROOT:-/var/lib/vllm/models}/${VLLM_OMNI_QWENIMAGE_DIR:-qwen-image-2512}:/model:ro
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8092/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s
